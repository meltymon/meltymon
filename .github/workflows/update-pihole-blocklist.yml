name: Update MELTYMON Pi-hole blocklist

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pihole-blocklist
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build curated blocklist
        run: python3 pihole/build-blocklist.py
      - name: Commit changes
        run: |
          if git diff --quiet -- pihole/custom-blocklist.txt; then
            echo "Blocklist unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pihole/custom-blocklist.txt
          git commit -m "Refresh curated Pi-hole blocklist"
          git push
